services:
  vote:
    build: ./vote
    ports:
      - "8082:80"
    environment:
      PORT: 80
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  result:
    build: ./result
    ports:
      - "8081:80"
    environment:
      PORT: 80
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-votes}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - front-tier
      - back-tier
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-votes}
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - back-tier
    restart: unless-stopped

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    networks:
      - back-tier
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-votes}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - back-tier
    restart: unless-stopped

volumes:
  db-data:

networks:
  front-tier:
  back-tier:
